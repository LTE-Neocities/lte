<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width = device-width, initial-scale = 1.0">
		<title>LTECenter</title>
		<link href="css/style.css" rel="stylesheet" type="text/css" media="all">
		<script src="js/date.js" defer></script>
	</head>
	<body onload=createList()>
		<div class=box>
			<header>
				<h1 class=lineHeight>LTECenter</h1>
				<p id=date></p>
				<p><a href='about.html'>ABOUT</a> | <a href='rules.html'>RULES</a> | <a href='credits.html'>CREDITS</a></p>
			</header>
			<hr>
			<div class=lineHeight id=list></div>
		</div>
		<div class=trans>
			<div class=infoBox>
				<p>hiasjasdjasjasjd</p>
				<p>aahahahaha</p>
			</div>
		</div>
	</body>
	<script>
		async function fetchJSON(url) {
			try {
				let r = await fetch(url),
				d = await r.json();
				return d;
			} catch (e) {
				console.error('didnt work bitch:', e);
			}
		}
		
		async function createList() {
			const jList = await fetchJSON('./list.json'),
			lteMap = new Map();
			
			for (let [id, properties] of Object.entries(jList.entries)) { // essentially stole from knockton LOL
				if (!properties.untrue && !properties.segments) {
					lteMap.set(id, [properties.name, properties.characters]);
				} else if (properties.segments) {
					let allChars = 0;
					for (let [s, sProps] of Object.entries(properties.segments)) if (!sProps.untrue) allChars += sProps.characters
					lteMap.set(id, [`[${properties.name}]`, allChars]);
				}
			}
			
			const lteSort = new Map([...lteMap.entries()].sort((a, b) => b[1][1] - a[1][1]));
			const list = document.getElementById('list');
			let sortIterator = 0;
			
			for (let [name, count] of lteSort.values()) {
				switch(sortIterator) {
					case 0:
						e = document.createElement('h2');
						e.style.color = 'gold';
						e.id = 'firstPlace';
						break;
					case 1:
						e = document.createElement('h3');
						e.style.color = 'gray';
						e.id = 'secondPlace';
						break;
					case 2:
						e = document.createElement('h4');
						e.style.color = 'sienna';
						e.id = 'thirdPlace';
						break;
					default:
						e = document.createElement('p');
				}		
					
				e.textContent = name;
				list.appendChild(e);
				sortIterator++;
			}
		}
	</script>
</html>
